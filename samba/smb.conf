# /etc/samba/smb.conf — Samba Configuration
# Add these blocks at the end of your existing smb.conf file

# --- Public Share (no password required) ---
[Public]
path = /srv/samba/public
browseable = yes
writable = yes
guest ok = yes
read only = no

# --- Secure Share (requires Samba user login) ---
[Secure]
path = /srv/samba/secure
valid users = secure
read only = no
browseable = yes

# Note: always run "testparm" after editing to check for errors
