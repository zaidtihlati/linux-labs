# /etc/exports — NFS Server Configuration
# Format: <directory> <client>(<options>)
# Use specific client IPs in production instead of wildcard *

# Public share — read-only for all clients
/nfs/etudiant/public *(ro,sync,no_subtree_check)

# Personal share — read-write for all clients
/nfs/etudiant/perso  *(rw,sync,no_subtree_check)
